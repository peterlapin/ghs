name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build release and formula
        run: |
          bash scripts/package.sh
          IFS= read -r version < VERSION
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Publish versioned archive
        run: |
          # Refuse to overwrite an existing tag or release.
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            echo "Tag v$VERSION already exists; see RELEASING.md for recovery." >&2
            exit 1
          fi
          assets=()
          for platform in darwin-arm64 darwin-amd64 linux-arm64 linux-amd64; do
            assets+=("dist/ghs-$VERSION-$platform.tar.gz" "dist/ghs-$VERSION-$platform.tar.gz.sha256")
          done
          gh release create "v$VERSION" "${assets[@]}" dist/ghs.rb \
            --target "$GITHUB_SHA" --title "ghs $VERSION" \
            --notes 'GHS binaries for macOS and Linux (arm64 and amd64). Git and gh-stack are required; Go and jq are not. See README.md for setup. Homebrew availability requires merging the formula-update PR.'
      - name: Open formula-update pull request
        run: |
          branch="codex/ghs-formula-v$VERSION"
          git switch -c "$branch"
          cp dist/ghs.rb Formula/ghs.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/ghs.rb
          git commit -m "Update Homebrew formula to ghs $VERSION"
          git push origin "$branch"
          cat > "$RUNNER_TEMP/formula-pr.md" <<EOF
          Point Homebrew at the published ghs $VERSION runtime archive and its calculated SHA-256 checksum.

          The release passed macOS and Linux checks. Review Formula/ghs.rb and run the published-archive Homebrew checks in RELEASING.md before merging. This PR uses GITHUB_TOKEN, so it does not trigger pull_request workflows automatically.
          EOF
          if gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
            --title "Homebrew: ghs $VERSION" --body-file "$RUNNER_TEMP/formula-pr.md"; then
            echo "Release published. Review and merge the Homebrew formula PR to enable installation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release published and formula branch pushed, but automatic PR creation failed. Open the PR using the link in the run summary."
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Manual Homebrew PR required

          The release was published and the formula is ready on \`$branch\`.
          GitHub could not create the PR automatically (for example, Actions-created PRs may be disabled).

          [Open the formula PR](https://github.com/$GH_REPO/compare/$DEFAULT_BRANCH...$branch?expand=1), review it, and merge it to enable Homebrew installation.

          To enable automatic PR creation for future releases, enable **Allow GitHub Actions to create and approve pull requests** in Settings → Actions → General.
          EOF
          fi
